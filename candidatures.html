<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Candidatures Yeita</title>
<meta name="robots" content="noindex">
<script>
/* L'espace Candidatures vit dans le dossier candidatures/. Les anciens liens (candidatures.html#c-<id>) y mènent. */
(function(){
  var m = /^#c-([A-Za-z0-9._~-]+)$/.exec(location.hash || "");
  location.replace(m ? "candidatures/candidat.html?id=" + encodeURIComponent(m[1]) : "candidatures/");
})();
</script>
</head>
<body><p><a href="candidatures/">Ouvrir l'espace Candidatures</a></p></body>
</html>
