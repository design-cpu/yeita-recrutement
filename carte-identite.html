<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Carte d'identité · Yeita</title>
<meta name="robots" content="noindex">
<script>
/* Ancienne adresse : la page a rejoint l'espace Candidatures. #c-<id> ouvre la carte du candidat, #p-<id> l'imprime ; #ec1, #ec2, #embauche ouvrent l'exemple. */
(function(){
  var h = (location.hash || "").slice(1), m = /^([cp])-([A-Za-z0-9._~-]+)$/.exec(h), to;
  if(m) to = "candidatures/carte.html?id=" + encodeURIComponent(m[2]) + (m[1] === "p" ? "&imprimer=1" : "");
  else if(h === "ec1" || h === "ec2" || h === "embauche") to = "candidatures/carte.html?exemple=" + h;
  else to = "candidatures/carte.html" + (h === "interne" ? "#interne" : "");
  location.replace(to);
})();
</script>
</head>
<body><p>Cette page a rejoint l'espace Candidatures : <a href="candidatures/">ouvrir Candidatures</a>.</p></body>
</html>
