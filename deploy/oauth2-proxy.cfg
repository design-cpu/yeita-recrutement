## oauth2-proxy du service front. Aucun secret ici : l'identifiant et le secret du client Google,
## le secret des cookies et l'URL de retour viennent de .env (variables OAUTH2_PROXY_*).

http_address = "0.0.0.0:4180"          # dans le conteneur ; compose.yaml ne publie le port que sur 127.0.0.1

## Le site construit, servi tel quel. La seconde entrée sert /index.html en 200 :
## le serveur de fichiers redirigerait sinon /index.html vers /.
## La troisième envoie /api/ au service api (réseau back), avec X-Forwarded-Email tiré de la session.
upstreams = [
  "file:///srv/site/#/",
  "file:///srv/site/#/index.html",
  "http://api:8000/api/",
]
## Sans session, une route d'API reçoit 401 (JSON) au lieu d'une redirection vers Google.
api_routes = ["^/api/"]

provider = "google"
email_domains = ["yeita.fr"]
skip_provider_button = true

## Les en-têtes X-Forwarded-* sont ignorés. Avec reverse_proxy = true, un en-tête
## X-Forwarded-Uri forgé ouvre une page protégée (vérifié en v1.1). Ne pas repasser à true
## sans que chaque proxy devant front réécrive X-Forwarded-Uri.
reverse_proxy = false
trusted_proxy_ips = ["172.30.0.0/24"]   # sans effet tant que reverse_proxy = false

cookie_secure = true
cookie_httponly = true
cookie_samesite = "lax"

## Pages publiques, sans connexion (liste fermée, chemin réel, expressions ancrées).
## Tout le reste exige un compte @yeita.fr. /ping est public par construction.
skip_auth_routes = [
  "^/$",
  "^/index\\.html$",
  "^/one-pager\\.html$",
  "^/yeita-match-kit\\.html$",
  "^/assets/yeita\\.css$",
  "^/assets/yeita\\.js$",
  "^/assets/data-yeita-match\\.js$",
  "^/telechargements/[A-Za-z0-9_-][A-Za-z0-9._-]*$",
]
