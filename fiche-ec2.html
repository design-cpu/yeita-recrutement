<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Fiche EC2 · Yeita</title>
<meta name="robots" content="noindex">
<script>
/* Ancienne adresse : la page a rejoint l'espace Candidatures. #c-<id> ouvre l'étape EC2 du candidat. */
(function(){
  var h = (location.hash || "").slice(1), m = /^([cp])-([A-Za-z0-9._~-]+)$/.exec(h), to;
  to = m ? "candidatures/ec2.html?id=" + encodeURIComponent(m[2]) : "candidatures/";
  location.replace(to);
})();
</script>
</head>
<body><p>Cette page a rejoint l'espace Candidatures : <a href="candidatures/">ouvrir Candidatures</a>.</p></body>
</html>
