# Espace Candidatures : front (oauth2-proxy qui sert le site et l'API), api (stockage) et, en option, caddy (cas B).
# Secrets et choix du cas dans .env (voir .env.example) ; mode d'emploi : deploy/README.md.
name: recrutement

x-journaux: &journaux
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  front:
    build:
      context: .
      dockerfile: docker/front.Dockerfile
    image: recrutement-front
    command: ["--config=/etc/oauth2-proxy/oauth2-proxy.cfg"]
    volumes:
      - ./deploy/oauth2-proxy.cfg:/etc/oauth2-proxy/oauth2-proxy.cfg:ro
    environment:
      OAUTH2_PROXY_CLIENT_ID: ${OAUTH2_PROXY_CLIENT_ID:?absent de .env}
      OAUTH2_PROXY_CLIENT_SECRET: ${OAUTH2_PROXY_CLIENT_SECRET:?absent de .env}
      OAUTH2_PROXY_COOKIE_SECRET: ${OAUTH2_PROXY_COOKIE_SECRET:?absent de .env}
      OAUTH2_PROXY_REDIRECT_URL: ${OAUTH2_PROXY_REDIRECT_URL:?absent de .env}
    ports:
      - "127.0.0.1:4180:4180"   # jamais sur une autre adresse : le serveur est partagé
    networks: [edge, back]      # back : le seul chemin vers l'api
    restart: unless-stopped
    logging: *journaux

  # L'API croit X-Forwarded-Email : seul front doit pouvoir la joindre. Aucun port publié, aucune variable
  # (l'image fixe NODE_ENV=production ; DEV_EMAIL et DEV_STATIC n'ont rien à faire ici).
  api:
    build:
      context: .
      dockerfile: docker/api.Dockerfile
    image: recrutement-api
    volumes:
      - data:/data
    networks: [back]
    restart: unless-stopped
    logging: *journaux

  # Cas B seulement (rien n'écoute sur 80 et 443) : COMPOSE_PROFILES=caddy dans .env.
  caddy:
    image: caddy:2.11.7
    profiles: [caddy]
    depends_on: [front]
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    environment:
      DOMAIN: ${DOMAIN:?absent de .env}
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    networks: [edge]
    restart: unless-stopped
    logging: *journaux

networks:
  # Interne (aucune sortie) et sans adresse côté hôte : sur Linux, l'hôte et tout conteneur en réseau hôte
  # joindraient sinon l'api par son adresse (vérifié en v1.3, IPv4 et IPv6).
  back:
    internal: true
    enable_ipv6: false
    driver_opts:
      com.docker.network.bridge.inhibit_ipv4: "true"
  edge:
    ipam:
      config:
        - subnet: 172.30.0.0/24

volumes:
  # La base des candidatures : la seule copie. Jamais « docker compose down -v » ni « docker volume prune ».
  data:
    name: recrutement_data
    labels:
      fr.yeita.projet: recrutement
  caddy_data:
  caddy_config:
