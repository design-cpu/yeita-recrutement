<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Hlýja</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{
  color-scheme:light;
  --bg:#ffffff; --side:#f9f9f8; --tile:#f7f7f5; --hover:rgba(55,53,47,.06); --active:rgba(55,53,47,.09);
  --line:#ececea; --line-strong:#dcdcd8;
  --ink:#37352f; --ink-strong:#191917; --muted:#787774; --faint:#a5a49f;
  --link:#2383e2; --accent:#191917;
  --green:#2f7d4f; --green-tag:#dbeddb; --green-ink:#1c3829;
  --yellow:#a3640b; --yellow-tag:#fdecc8; --yellow-ink:#402c1b;
  --red:#c4463a; --red-tag:#ffe2dd; --red-ink:#5d1715;
  --blue:#2b6cb0; --blue-tag:#d3e5ef; --blue-ink:#183347;
  --gray-tag:#ebeae7; --gray-ink:#32302c;
  --purple-tag:#e8deee; --purple-ink:#412454;
  --callout:#f7f6f3;
  --font:"Inter",ui-sans-serif,-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif;
  --mono:"JetBrains Mono",ui-monospace,SFMono-Regular,Menlo,monospace;
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --bg:#191919; --side:#202020; --tile:#232323; --hover:rgba(255,255,255,.055); --active:rgba(255,255,255,.085);
  --line:#2c2c2c; --line-strong:#3a3a3a;
  --ink:#d4d4d2; --ink-strong:#f1f1ef; --muted:#9b9b98; --faint:#6f6f6c;
  --link:#529cca; --accent:#f1f1ef;
  --green:#5fb57f; --green-tag:#2b4436; --green-ink:#c6e7d1;
  --yellow:#e0a84a; --yellow-tag:#4a3a1d; --yellow-ink:#f6deb0;
  --red:#ec7d70; --red-tag:#4f2a26; --red-ink:#f8cbc4;
  --blue:#6aa5d8; --blue-tag:#22394c; --blue-ink:#c9e1f4;
  --gray-tag:#333331; --gray-ink:#d4d4d2;
  --purple-tag:#3d2f49; --purple-ink:#e3d3ef;
  --callout:#232323;
}
*{box-sizing:border-box}
html,body{margin:0}
html{scroll-padding-top:60px}
body{background:var(--bg);color:var(--ink);font:400 15px/1.6 var(--font);-webkit-font-smoothing:antialiased;font-feature-settings:"cv11","ss01"}
a{color:inherit;text-decoration:none}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
:focus-visible{outline:2px solid var(--link);outline-offset:2px;border-radius:4px}
.ic{width:18px;height:18px;flex-shrink:0;fill:currentColor}
.ic.s{width:16px;height:16px}

/* Structure */
.app{display:flex;min-height:100vh}
.side{width:248px;flex-shrink:0;background:var(--side);border-right:1px solid var(--line);position:sticky;top:0;height:100vh;overflow-y:auto;padding:10px 8px 24px;display:flex;flex-direction:column}
.ws{display:flex;align-items:center;gap:10px;padding:8px 10px 14px}
.ws-mark{width:26px;height:26px;border-radius:6px;background:var(--accent);color:var(--bg);display:grid;place-items:center;flex-shrink:0}
.ws b{display:block;font-size:14px;font-weight:600;color:var(--ink-strong);line-height:1.25}
.ws small{display:block;font-size:12px;color:var(--muted);line-height:1.3}
.nav-sec{font-size:12px;font-weight:500;color:var(--faint);padding:14px 10px 4px}
.nav-a{display:flex;align-items:center;gap:9px;min-height:30px;padding:4px 10px;border-radius:6px;color:var(--muted);font-size:14px;font-weight:500}
.nav-a .t{flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.nav-a:hover{background:var(--hover);color:var(--ink)}
.nav-a.active{background:var(--active);color:var(--ink-strong)}
.nav-a .vn{font-size:12px;font-weight:600;min-width:28px;height:20px;border-radius:5px;display:grid;place-items:center;padding:0 4px}
.nav-a .cnt{font-size:12px;color:var(--faint)}
.nav-empty{padding:4px 10px;color:var(--faint);font-size:13px}
.main{flex:1;min-width:0}
.topbar{position:sticky;top:0;z-index:5;display:flex;align-items:center;gap:8px;height:46px;padding:0 14px;background:var(--bg)}
.crumbs{flex:1;min-width:0;display:flex;align-items:center;gap:4px;font-size:14px;color:var(--muted);white-space:nowrap;overflow:hidden}
.crumbs a,.crumbs span{padding:2px 6px;border-radius:4px;overflow:hidden;text-overflow:ellipsis}
.crumbs a:hover{background:var(--hover);color:var(--ink)}
.crumbs .sep{padding:0;color:var(--faint)}
.icon-btn{width:30px;height:30px;border-radius:6px;display:grid;place-items:center;color:var(--muted);flex-shrink:0}
.icon-btn:hover{background:var(--hover);color:var(--ink)}
.live{display:inline-flex;align-items:center;gap:6px;font-size:12.5px;color:var(--faint);margin-right:4px;white-space:nowrap}
.live i{width:7px;height:7px;border-radius:50%;background:var(--faint);display:inline-block}
.live.on i{background:var(--green)} .live.off i{background:var(--red)}
.start{max-width:560px;margin:12vh auto;padding:0 20px}
.start h1{font-size:30px;font-weight:700;color:var(--ink-strong);margin:18px 0 10px;letter-spacing:-.02em}
.start p{color:var(--muted);margin:0 0 18px}
.start .cmd{display:flex;align-items:center;gap:10px;background:var(--tile);border-radius:10px;padding:14px 16px;font-family:var(--mono);font-size:14.5px;color:var(--ink-strong)}
.start .cmd span{flex:1}
.start .cmd button{display:inline-flex;align-items:center;gap:6px;font-family:var(--font);font-size:13px;font-weight:500;padding:6px 10px;border-radius:6px;background:var(--bg);box-shadow:0 0 0 1px var(--line)}
.start small{display:block;color:var(--faint);margin-top:14px;font-size:13px;line-height:1.5}
#menuBtn{display:none}
.page{max-width:960px;margin:0 auto;padding:36px 56px 120px}
.page.wide{max-width:1160px}
.page.with-toc{max-width:1200px;display:grid;grid-template-columns:minmax(0,1fr) 220px;gap:48px}
.page.with-toc > .col,.toc-grid > .col{min-width:0}
.page.wide-toc{max-width:1200px}
.toc-grid{display:grid;grid-template-columns:minmax(0,1fr) 200px;gap:40px}

/* Sommaire */
.toc{position:sticky;top:64px;align-self:start;font-size:13.5px;max-height:calc(100vh - 90px);overflow-y:auto;padding-bottom:12px}
.toc b{display:block;font-size:12px;font-weight:600;color:var(--faint);margin:0 0 8px}
.toc a{display:block;padding:4px 0 4px 12px;border-left:2px solid var(--line);color:var(--muted);line-height:1.4}
.toc a.sub{padding-left:24px;font-size:13px}
.toc a:hover{color:var(--ink)}
.toc a.on{border-left-color:var(--ink-strong);color:var(--ink-strong);font-weight:500}

/* En-tête de page */
.p-icon{width:64px;height:64px;border-radius:12px;display:grid;place-items:center;font-size:24px;font-weight:700;margin:12px 0 18px;letter-spacing:-.02em}
.p-icon .ic{width:30px;height:30px}
h1.p-title{font-size:38px;line-height:1.18;font-weight:700;color:var(--ink-strong);letter-spacing:-.022em;margin:0 0 14px;text-wrap:balance}
.lede{color:var(--muted);font-size:16px;margin:-4px 0 26px;max-width:64ch}
.props{display:grid;grid-template-columns:150px 1fr;gap:2px 8px;margin:0 0 26px;font-size:14px}
.props dt{display:flex;align-items:center;gap:8px;color:var(--muted);min-height:32px;padding:0 6px}
.props dd{margin:0;display:flex;align-items:center;flex-wrap:wrap;gap:6px;min-height:32px;padding:2px 6px;border-radius:5px}
.props dd:hover{background:var(--hover)}
.copy{display:inline-flex;align-items:center;gap:6px;font-family:var(--mono);font-size:13px;color:var(--ink);padding:1px 6px;border-radius:5px;background:var(--tile)}
.copy:hover{background:var(--active)}
.src{font-family:var(--mono);font-size:12.5px;color:var(--ink);background:var(--tile);padding:1px 6px;border-radius:4px}
.fresh{display:inline-flex;align-items:center;gap:6px}
.fresh i{width:8px;height:8px;border-radius:50%;background:var(--green);display:inline-block}

/* Étiquettes */
.tag{display:inline-flex;align-items:center;height:22px;padding:0 8px;border-radius:4px;font-size:13px;font-weight:500;white-space:nowrap;background:var(--gray-tag);color:var(--gray-ink);line-height:1}
.tag.green{background:var(--green-tag);color:var(--green-ink)} .tag.yellow{background:var(--yellow-tag);color:var(--yellow-ink)}
.tag.red{background:var(--red-tag);color:var(--red-ink)} .tag.blue{background:var(--blue-tag);color:var(--blue-ink)} .tag.purple{background:var(--purple-tag);color:var(--purple-ink)}
.vlink{display:inline-flex;align-items:center;height:20px;padding:0 6px;border-radius:4px;font-size:12px;font-weight:600;background:var(--blue-tag);color:var(--blue-ink)!important;vertical-align:1px;text-decoration:none!important;font-variant-numeric:tabular-nums}
.vlink:hover{filter:brightness(.95)}

/* Glossaire au survol */
.term{border-bottom:1px dashed var(--faint);cursor:help;position:relative}
.term .pop{display:none;position:absolute;left:0;top:calc(100% + 8px);z-index:20;width:300px;max-width:80vw;background:var(--bg);border:1px solid var(--line-strong);border-radius:8px;padding:12px 14px;font-size:13.5px;line-height:1.5;color:var(--ink);font-weight:400;box-shadow:0 8px 24px rgba(0,0,0,.08);white-space:normal;text-align:left}
.term .pop b{display:block;color:var(--ink-strong);margin-bottom:2px;font-weight:600}
.term .pop a{display:inline-block;margin-top:6px;font-size:13px;color:var(--link)!important;text-decoration:none!important}
.term:hover .pop,.term:focus .pop,.term:focus-within .pop{display:block}

/* Tuiles */
.tiles{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;margin:0 0 30px}
.tile{background:var(--tile);border-radius:10px;padding:16px 18px 18px;display:flex;flex-direction:column;gap:6px;min-width:0}
.tile .k{font-size:13px;color:var(--muted);font-weight:500;display:flex;align-items:center;gap:7px}
.tile .v{font-size:32px;line-height:1.15;font-weight:700;color:var(--ink-strong);letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.tile .v small{font-size:15px;font-weight:500;color:var(--faint);margin-left:3px;letter-spacing:0}
.tile .f{font-size:13px;color:var(--muted);margin-top:auto;display:flex;align-items:center;gap:8px;min-height:22px}
.meter{height:6px;border-radius:3px;background:var(--line);overflow:hidden;flex:1}
.meter > i{display:block;height:100%;border-radius:3px;background:var(--ink-strong)}

.h2{display:flex;align-items:baseline;gap:10px;font-size:20px;font-weight:600;color:var(--ink-strong);margin:36px 0 12px;letter-spacing:-.01em}
.h2 span{font-size:14px;font-weight:500;color:var(--faint)}

/* Onglets */
.tabs{display:flex;gap:2px;border-bottom:1px solid var(--line);margin:0 0 26px;overflow-x:auto}
.tabs a{display:flex;align-items:center;gap:7px;padding:8px 10px 10px;font-size:14px;font-weight:500;color:var(--muted);white-space:nowrap;border-bottom:2px solid transparent;margin-bottom:-1px}
.tabs a:hover{color:var(--ink)}
.tabs a.active{color:var(--ink-strong);border-bottom-color:var(--ink-strong)}

/* Bascule lisible / complet */
.viewbar{display:flex;align-items:center;justify-content:space-between;gap:12px;margin:0 0 18px;flex-wrap:wrap}
.viewbar .hint{font-size:13px;color:var(--faint)}
.seg{display:inline-flex;padding:2px;background:var(--tile);border-radius:7px;gap:2px}
.seg button{padding:4px 10px;border-radius:5px;font-size:13px;font-weight:500;color:var(--muted)}
.seg button.on{background:var(--bg);color:var(--ink-strong);box-shadow:0 0 0 1px var(--line)}

/* Tableau base de données */
.db{width:100%;border-collapse:collapse;font-size:14px}
.db th{text-align:left;font-weight:500;color:var(--muted);font-size:13px;padding:8px 10px;border-bottom:1px solid var(--line);white-space:nowrap}
.db td{padding:10px;border-bottom:1px solid var(--line);vertical-align:middle}
.db tbody tr{cursor:pointer}
.db tbody tr:hover{background:var(--hover)}
.db .num{text-align:right;white-space:nowrap;font-variant-numeric:tabular-nums}
.db .ttl{font-weight:500;color:var(--ink-strong)}
.db-wrap{overflow-x:auto;border-top:1px solid var(--line)}

/* Listes */
.rows a{display:flex;align-items:center;gap:12px;padding:10px 8px;border-radius:6px}
.rows a:hover{background:var(--hover)}
.rows .n{font-size:13px;font-weight:600;color:var(--faint);min-width:22px;font-variant-numeric:tabular-nums}
.rows .grow{flex:1;min-width:0}
.rows .grow b{display:block;font-weight:500;color:var(--ink-strong);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rows .grow span{display:block;font-size:13px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

.gallery{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:12px}
.gcard{display:block;border:1px solid var(--line);border-radius:10px;padding:16px;transition:background .15s}
.gcard:hover{background:var(--hover)}
.gcard b{display:block;font-weight:600;color:var(--ink-strong);margin:8px 0 4px}
.gcard p{margin:0 0 10px;font-size:13.5px;color:var(--muted);line-height:1.5}
.todo{display:flex;align-items:center;gap:14px;padding:14px 16px;border-radius:10px;background:var(--blue-tag);color:var(--blue-ink);margin-bottom:8px}
.todo:hover{filter:brightness(.98)}
.todo .grow{flex:1;min-width:0} .todo b{display:block;font-weight:600} .todo span{font-size:13.5px;opacity:.85}

/* Graphiques */
.panel{border:1px solid var(--line);border-radius:10px;padding:18px 20px;margin:0 0 22px}
.panel h3{margin:0 0 2px;font-size:15px;font-weight:600;color:var(--ink-strong)}
.panel p.sub{margin:0 0 14px;font-size:13.5px;color:var(--muted)}
.bars{display:grid;gap:10px}
.barrow{display:grid;grid-template-columns:150px 1fr 44px;gap:14px;align-items:center;font-size:14px}
.barrow .lbl{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.barrow .track{position:relative;height:10px;border-radius:5px;background:var(--line)}
.barrow .fill{position:absolute;inset:0 auto 0 0;border-radius:5px}
.barrow .mk{position:absolute;top:-4px;bottom:-4px;width:2px;background:var(--faint)}
.barrow b{text-align:right;font-variant-numeric:tabular-nums;font-weight:600;color:var(--ink-strong)}
.legend{display:flex;gap:16px;font-size:12.5px;color:var(--faint);margin:12px 0 0 164px}
.split{display:grid;grid-template-columns:2fr 1fr;gap:12px;margin:0 0 22px}
.split .panel{margin:0}
.arb{display:flex;flex-direction:column;gap:10px}
.arb .big{font-size:28px;font-weight:700;color:var(--ink-strong);line-height:1.1}
.arb .row{display:flex;justify-content:space-between;font-size:14px;color:var(--muted)}
.arb .meter{flex:none}

/* Frise */
.tl{list-style:none;margin:0;padding:0}
.tl li{position:relative;padding-left:40px}
.tl li:before{content:"";position:absolute;left:13px;top:34px;bottom:-2px;width:1px;background:var(--line-strong)}
.tl li:last-child:before{display:none}
.tl .nd{position:absolute;left:2px;top:10px;width:24px;height:24px;border-radius:6px;display:grid;place-items:center;background:var(--tile);color:var(--muted)}
.tl li.ch .nd{background:var(--yellow-tag);color:var(--yellow-ink)}
.tl li.cd .nd{background:var(--purple-tag);color:var(--purple-ink)}
.tl li.final .nd{background:var(--ink-strong);color:var(--bg)}
.tl a{display:block;padding:8px 10px 12px;border-radius:8px}
.tl a:hover{background:var(--hover)}
.tl b{display:block;font-weight:600;color:var(--ink-strong)}
.tl .sub{display:block;font-size:14px;color:var(--muted);margin:2px 0 8px}
.tl .tags{display:flex;gap:6px;flex-wrap:wrap}

/* Changelog */
.cl-v{display:grid;grid-template-columns:120px 1fr;gap:20px;padding:22px 0;border-bottom:1px solid var(--line)}
.cl-v:first-of-type{border-top:1px solid var(--line)}
.cl-v .when{font-size:13px;color:var(--faint)}
.cl-v .when .vlink{height:24px;font-size:13.5px;padding:0 8px;margin-bottom:6px}
.cl-v h3{margin:0 0 8px;font-size:17px;font-weight:600;color:var(--ink-strong)}
.cl-v ul{list-style:none;margin:0;padding:0}
.cl-v li{display:flex;gap:10px;align-items:baseline;padding:3px 0}
.cl-v li .tag{flex-shrink:0;min-width:84px;justify-content:center}

/* Règles apprises, glossaire */
.rule{display:flex;gap:14px;padding:14px 4px;border-bottom:1px solid var(--line)}
.rule .n{width:24px;height:24px;border-radius:6px;background:var(--purple-tag);color:var(--purple-ink);display:grid;place-items:center;font-size:13px;font-weight:600;flex-shrink:0;margin-top:1px}
.rule p{margin:0 0 3px;color:var(--ink-strong)}
.rule small{color:var(--faint);font-size:13px}
.gl-term{padding:18px 0;border-bottom:1px solid var(--line)}
.gl-term h2{margin:0 0 4px;font-size:18px;font-weight:600;color:var(--ink-strong)}
.gl-term .aka{font-size:13px;color:var(--faint);margin:0 0 6px}
.gl-term .used{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px;font-size:13px;color:var(--faint);align-items:center}
.gl-term .used a{color:var(--ink);background:var(--tile);border-radius:4px;padding:1px 7px}
.gl-term .used a:hover{background:var(--active)}

.empty{padding:36px 24px;border-radius:10px;background:var(--tile);color:var(--muted);text-align:center;font-size:14.5px}
.empty code{font-family:var(--mono);font-size:13px}

/* Document Markdown */
.md{font-size:16px;line-height:1.65;color:var(--ink)}
.md > h1:first-child{display:none}
.filters{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin:0 0 14px}
.filters .seg button small{margin-left:5px;color:var(--faint);font-weight:500}
.db td .sum{display:block;font-size:13px;color:var(--muted);font-weight:400;margin-top:2px;max-width:52ch;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.db td.id{color:var(--faint);font-weight:600;font-variant-numeric:tabular-nums;white-space:nowrap}
.db td .tag + .tag, .props dd .tag + .tag{margin-left:4px}
.decide{border:1px solid var(--line);border-radius:10px;padding:14px 18px;margin:4px 0 22px}
.decide h3{margin:0 0 4px;font-size:15px;font-weight:600;color:var(--ink-strong);display:flex;align-items:center;gap:8px}
.decide p{margin:8px 0;font-size:14px;color:var(--muted);line-height:1.55}
.decide code{font-size:13px}
.filters .seg{flex-wrap:wrap}
@media (max-width:700px){ .rows.bl a .tag{display:none} }
.md h1{font-size:30px;font-weight:700;color:var(--ink-strong);margin:32px 0 8px;letter-spacing:-.02em}
.md h2{font-size:23px;line-height:1.3;font-weight:600;color:var(--ink-strong);margin:34px 0 8px;letter-spacing:-.012em}
.md h3{font-size:18px;line-height:1.35;font-weight:600;color:var(--ink-strong);margin:24px 0 4px}
.md h4{font-size:16px;font-weight:600;margin:18px 0 4px}
.md p{margin:6px 0}
.md strong{color:var(--ink-strong);font-weight:600}
.md ul,.md ol{padding-left:24px;margin:6px 0} .md li{margin:3px 0;padding-left:2px}
.md li.task{list-style:none;margin:2px 0 2px -24px;display:flex;align-items:flex-start;gap:10px;padding:3px 4px;border-radius:5px}
.md li.task:hover{background:var(--hover)}
.md li.task input{width:16px;height:16px;margin:4px 0 0;accent-color:var(--link);flex-shrink:0;cursor:pointer}
.md li.task.done > span{color:var(--faint);text-decoration:line-through}
.md code{font-family:var(--mono);font-size:.85em;color:#eb5757;background:rgba(135,131,120,.15);padding:2px 5px;border-radius:4px}
:root[data-theme="dark"] .md code{color:#ff7369}
.md pre{background:var(--tile);border-radius:8px;padding:16px 18px;overflow-x:auto;font-size:13.5px;line-height:1.6;margin:10px 0}
.md pre code{background:none;color:var(--ink);padding:0;font-size:inherit}
.md blockquote{margin:10px 0;padding:0 0 0 14px;border-left:3px solid var(--ink-strong);color:var(--ink)}
.md blockquote.callout{display:flex;gap:12px;border:0;padding:14px 16px;border-radius:8px;background:var(--callout);margin:4px 0 22px}
.md blockquote.callout .ci{flex-shrink:0;margin-top:3px;color:var(--muted)}
.md blockquote.callout > div{flex:1;min-width:0}
.md blockquote.callout p{margin:2px 0}
.md .tbl{overflow-x:auto;margin:12px 0}
.md table{border-collapse:collapse;width:100%;font-size:14.5px;line-height:1.5}
.md th,.md td{padding:8px 10px;text-align:left;vertical-align:top;border:1px solid var(--line)}
.md th{font-weight:500;color:var(--muted);font-size:13.5px;background:var(--side)}
.md hr{border:0;border-top:1px solid var(--line);margin:24px 0}
.md a:not(.vlink){color:var(--ink-strong);text-decoration:underline;text-decoration-color:var(--line-strong);text-underline-offset:3px}
.md a:not(.vlink):hover{text-decoration-color:var(--ink-strong)}
.md details{margin:6px 0}
.md details > summary{cursor:pointer;list-style:none;display:flex;align-items:center;gap:8px;padding:4px 4px 4px 0;font-size:17px;font-weight:600;color:var(--ink-strong);border-radius:5px}
.md details > summary:hover{background:var(--hover)}
.md details > summary::-webkit-details-marker{display:none}
.md details > summary:before{content:"";width:0;height:0;border-left:6px solid var(--ink);border-top:4.5px solid transparent;border-bottom:4.5px solid transparent;transition:transform .15s;margin:0 6px;flex-shrink:0}
.md details[open] > summary:before{transform:rotate(90deg)}
.md details > .inner{padding:2px 0 8px 26px}
.md details > .inner > h2:first-child{display:none}
.md .mmd{margin:14px 0;padding:18px;border:1px solid var(--line);border-radius:10px;overflow-x:auto;text-align:center}
.md .mmd svg{max-width:100%;height:auto}
.md .mmd pre{text-align:left;margin:0}
.md .mmd pre[data-processed]{background:none;padding:0;overflow:visible}
.md .mmd .cap{font-size:12.5px;color:var(--faint);text-align:left;margin-top:8px}
.md .flash{animation:flash 1.6s ease-out}
@keyframes flash{0%{background:var(--yellow-tag)}100%{background:transparent}}
.st-ok{color:var(--green);font-weight:600} .st-ko{color:var(--red);font-weight:600} .st-wait{color:var(--yellow);font-weight:600}

.scrim{display:none}
@media (max-width:1100px){ .page.with-toc,.toc-grid{grid-template-columns:minmax(0,1fr);gap:0} .toc{display:none} }
@media (max-width:1000px){ .tiles{grid-template-columns:repeat(2,minmax(0,1fr))} .split{grid-template-columns:1fr} }
@media (max-width:820px){
  .side{position:fixed;inset:0 auto 0 0;z-index:30;transform:translateX(-100%);transition:transform .2s}
  .side.open{transform:none;box-shadow:0 0 0 1px var(--line),0 16px 40px rgba(0,0,0,.18)}
  .scrim.open{display:block;position:fixed;inset:0;z-index:20;background:rgba(15,15,15,.35)}
  #menuBtn{display:grid}
  .page,.page.with-toc{padding:18px 18px 80px}
  h1.p-title{font-size:30px}
  .props{grid-template-columns:110px 1fr}
  .barrow{grid-template-columns:96px 1fr 36px;gap:10px} .legend{margin-left:0}
  .cl-v{grid-template-columns:1fr;gap:8px}
}
@media (max-width:480px){ .tiles{grid-template-columns:1fr 1fr;gap:8px} .tile{padding:12px 14px} .tile .v{font-size:26px} }
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}

/* ---------- Thème ---------- */
const curTheme = () => document.documentElement.getAttribute('data-theme');
function applyTheme(t){
  const th = t || (matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
  document.documentElement.setAttribute('data-theme', th);

/* ---------- Mermaid (chargé à la demande, repli sur le texte) ---------- */
let mermaidState = 'idle'; const mermaidQueue = [];
function renderMermaid(root){
  const nodes = [...root.querySelectorAll('.mmd pre.mermaid')];
  if (!nodes.length) return;
  const go = () => {
    try{
      window.mermaid.initialize({ startOnLoad:false, theme: curTheme() === 'dark' ? 'dark' : 'neutral', fontFamily:'Inter, ui-sans-serif, sans-serif', securityLevel:'strict' });
      window.mermaid.run({ nodes }).catch(() => nodes.forEach(fallback));
    }catch(e){ nodes.forEach(fallback); }
  };
  if (mermaidState === 'ready') return go();
  if (mermaidState === 'failed') return nodes.forEach(fallback);
  mermaidQueue.push(go);
  if (mermaidState === 'loading') return;
  mermaidState = 'loading';
  const s = document.createElement('script');
  s.src = 'https://cdn.jsdelivr.net/npm/mermaid@11.4.1/dist/mermaid.min.js';
  s.onload = () => { mermaidState = 'ready'; mermaidQueue.splice(0).forEach(f => f()); };
  s.onerror = () => { mermaidState = 'failed'; document.querySelectorAll('.mmd pre.mermaid').forEach(fallback); };
  document.head.appendChild(s);
}
function fallback(pre){
  if (pre.dataset.fb) return; pre.dataset.fb = '1';
  pre.classList.remove('mermaid');
  pre.innerHTML = '<code>' + esc(pre.getAttribute('data-src') || pre.textContent) + '</code>';
  pre.insertAdjacentHTML('afterend', '<div class="cap">Schéma affiché en texte : le moteur de schémas n\u2019a pas pu être chargé (hors ligne ?).</div>');
}

/* ---------- Markdown ---------- */
function inline(s){
  const codes = [];
  s = esc(s).replace(/`([^`]+)`/g, (_, c) => { codes.push(c); return '\u0000' + (codes.length - 1) + '\u0000'; });
  s = s.replace(/\[([^\]]+)\]\(([^)\s]+)\)/g, (_, t, u) => /^(https?:|mailto:)/.test(u) ? '<a href="' + u + '" target="_blank" rel="noopener">' + t + '</a>' : '<a href="#" data-md="' + u + '">' + t + '</a>');
  s = s.replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>')
       .replace(/(^|[^*\w])\*([^*\n]+)\*(?!\w)/g, '$1<em>$2</em>')
       .replace(/(^|[\s(])_([^_\n]+)_(?=[\s).,;:!?]|$)/g, '$1<em>$2</em>');
  return s.replace(/\u0000(\d+)\u0000/g, (_, i) => '<code>' + codes[+i] + '</code>');
}
function splitRow(l){ return l.trim().replace(/^\|/, '').replace(/\|$/, '').split(/(?<!\\)\|/).map(c => c.trim().replace(/\\\|/g, '|')); }
function md(src){
  const lines = src.replace(/\r/g, '').split('\n');
  let out = '', i = 0;
  const isBlockStart = l => /^(#{1,6}\s|```|>|\s*([-*+]|\d+\.)\s|\|)/.test(l) || /^-{3,}\s*$/.test(l);
  while (i < lines.length){
    const l = lines[i];
    if (/^\s*$/.test(l)){ i++; continue; }
    let m;
    if ((m = l.match(/^```\s*(\w*)/))){
      const lang = m[1], buf = []; i++;
      while (i < lines.length && !/^```\s*$/.test(lines[i])) buf.push(lines[i++]);
      i++;
      const code = buf.join('\n');
      out += lang === 'mermaid' ? '<div class="mmd"><pre class="mermaid" data-src="' + esc(code) + '">' + esc(code) + '</pre></div>' : '<pre><code>' + esc(code) + '</code></pre>';
      continue;
    }
    if ((m = l.match(/^(#{1,6})\s+(.*)$/))){ const n = m[1].length; out += '<h' + n + '>' + inline(m[2]) + '</h' + n + '>'; i++; continue; }
    if (/^-{3,}\s*$/.test(l)){ out += '<hr>'; i++; continue; }
    if (/^\s*\|/.test(l) && i + 1 < lines.length && /^\s*\|?\s*:?-{2,}/.test(lines[i + 1])){
      const head = splitRow(l); i += 2; const rows = [];
      while (i < lines.length && /^\s*\|/.test(lines[i])) rows.push(splitRow(lines[i++]));
      out += '<div class="tbl"><table><thead><tr>' + head.map(h => '<th>' + inline(h) + '</th>').join('') + '</tr></thead><tbody>' +
        rows.map(r => '<tr>' + r.map(c => '<td>' + cell(c) + '</td>').join('') + '</tr>').join('') + '</tbody></table></div>';
      continue;
    }
    if (/^>/.test(l)){
      const buf = [];
      while (i < lines.length && /^>/.test(lines[i])) buf.push(lines[i++].replace(/^>\s?/, ''));
      out += '<blockquote><div>' + md(buf.join('\n')) + '</div></blockquote>'; continue;
    }
    if (/^\s*([-*+]|\d+\.)\s/.test(l)){
      const items = [];
      while (i < lines.length && (/^\s*([-*+]|\d+\.)\s/.test(lines[i]) || (/^\s{2,}\S/.test(lines[i]) && items.length))){
        const lm = lines[i].match(/^(\s*)([-*+]|\d+\.)\s+(.*)$/);
        if (lm) items.push({ ind: lm[1].length, ord: /\d/.test(lm[2]), text: lm[3] });
        else items[items.length - 1].text += ' ' + lines[i].trim();
        i++;
      }
      out += list(items); continue;
    }
    const buf = [];
    while (i < lines.length && !/^\s*$/.test(lines[i]) && !isBlockStart(lines[i])) buf.push(lines[i++]);
    if (!buf.length) buf.push(lines[i++]);
    out += '<p>' + buf.map(inline).join('<br>') + '</p>';
  }
  return out;
}
function cell(c){
  const t = c.toLowerCase().replace(/[*`]/g, '').trim(), h = inline(c);
  if (/^(ok|oui|validee?|valide|integre|terminee|atteint|resolu|recevable|réussie?|corrige|corrigé|réutiliser|✓|✅)$/.test(t)) return '<span class="st-ok">' + h + '</span>';
  if (/^(echec|échec|ko|non-validee|arretee|arret|bloquant|rejete|non-atteint|non-resolu|✗|❌)$/.test(t)) return '<span class="st-ko">' + h + '</span>';
  if (/^(manuel|majeur|partiel|a-faire|en-cours|nouveau-tour|a-arbitrer|ecarte|écarté|validee-avec-reserves|valide-avec-reserves|important|ajuster|question)$/.test(t)) return '<span class="st-wait">' + h + '</span>';
  return h;
}
function list(items){
  let html = '', stack = [];
  items.forEach(it => {
    while (stack.length && it.ind < stack[stack.length - 1].ind){ html += '</li></' + stack.pop().tag + '>'; }
    if (!stack.length || it.ind > stack[stack.length - 1].ind){ const tag = it.ord ? 'ol' : 'ul'; stack.push({ ind: it.ind, tag }); html += '<' + tag + '>'; }
    else html += '</li>';
    const t = it.text.match(/^\[([ xX])\]\s+(.*)$/);
    if (t) html += '<li class="task' + (t[1] !== ' ' ? ' done' : '') + '"><input type="checkbox" disabled' + (t[1] !== ' ' ? ' checked' : '') + '><span>' + inline(t[2]) + '</span>';
    else html += '<li>' + inline(it.text);
  });
  while (stack.length) html += '</li></' + stack.pop().tag + '>';
  return html;
}

/* ---------- Glossaire et versions ---------- */
const VERSION_NUMS = {};
D.versions.forEach(v => { const n = String((v.files.version && v.files.version.meta.version) || v.id.split('-')[0]); VERSION_NUMS[n] = v.id; });
const vlink = n => VERSION_NUMS[n] ? '<a class="vlink" href="#/v/' + encodeURIComponent(VERSION_NUMS[n]) + '" title="Version ' + esc(n) + '">' + esc(n) + '</a>' : esc(n);
const TERMS = (function(){
  if (!D.glossaire) return [];
  const out = []; let cur = null;
  D.glossaire.body.replace(/\r/g, '').split('\n').forEach(l => {
    const h = l.match(/^##\s+(.+)$/);
    if (h){ cur = { term: h[1].trim(), id: slug(h[1]), def: [], aka: [], see: '' }; out.push(cur); return; }
    if (!cur) return;
    const a = l.match(/^Aussi\s*:\s*(.+)$/i); if (a){ cur.aka = a[1].split(',').map(x => x.trim()).filter(Boolean); return; }
    const s = l.match(/^Voir\s*:\s*(.+)$/i); if (s){ cur.see = s[1]; return; }
    if (l.trim()) cur.def.push(l.trim());
  });
  out.forEach(t => { t.text = t.def.join(' '); t.forms = [t.term, ...t.aka].sort((a, b) => b.length - a.length); });

const TERM_RE = TERMS.length ? new RegExp('(?<![\\p{L}\\p{N}_-])(' + TERMS.flatMap(t => t.forms).sort((a, b) => b.length - a.length).map(f => f.replace(/[.*+?^${}()|[\]\\]/g, '\\$&')).join('|') + ')(?![\\p{L}\\p{N}_])', 'giu') : null;
const termOf = w => TERMS.find(t => t.forms.some(f => f.toLowerCase() === w.toLowerCase()));
function enrich(root, opts){
  const seen = new Set();
  const walker = document.createTreeWalker(root, NodeFilter.SHOW_TEXT, { acceptNode(n){
    if (!n.nodeValue.trim()) return NodeFilter.FILTER_REJECT;
    let p = n.parentElement;
    while (p && p !== root){ if (/^(CODE|PRE|A|H1|H2|H3|H4|SUMMARY|BUTTON|SCRIPT)$/.test(p.tagName) || p.classList.contains('term') || p.classList.contains('mmd')) return NodeFilter.FILTER_REJECT; p = p.parentElement; }
    return NodeFilter.FILTER_ACCEPT;
  }});
  const nodes = []; while (walker.nextNode()) nodes.push(walker.currentNode);
  nodes.forEach(n => {
    const txt = n.nodeValue;
    const td = n.parentElement && n.parentElement.closest('td');
    if (td && td.textContent.trim() === txt.trim() && VERSION_NUMS[txt.trim()]){ const s = document.createElement('span'); s.innerHTML = vlink(txt.trim()); n.replaceWith(s.firstChild); return; }
    let html = esc(txt), changed = false;
    html = html.replace(/(?<![\w.])v(\d+\.\d+)(?![\w.]*\d)/g, (m, num) => VERSION_NUMS[num] ? (changed = true, vlink(num)) : m);
    if (TERM_RE && !opts.noTerms){
      html = html.replace(TERM_RE, (m) => {
        const t = termOf(m); if (!t || seen.has(t.id)) return m;
        seen.add(t.id); changed = true;
        return '<span class="term" tabindex="0">' + m + '<span class="pop" role="tooltip"><b>' + esc(t.term) + '</b>' + inline(t.text) + '<br><a href="#/glossaire/' + t.id + '">Voir le glossaire</a></span></span>';
      });
    }
    if (!changed) return;
    const span = document.createElement('span'); span.innerHTML = html;
    n.replaceWith(...span.childNodes);
  });
}

function resolve(from, rel){
  const [p, frag] = rel.split('#');
  if (!p) return from + (frag ? '#' + frag : '');
  const parts = from.split('/'); parts.pop();
  p.split('/').forEach(x => { if (x === '..') parts.pop(); else if (x !== '.') parts.push(x); });
  return parts.join('/') + (frag ? '#' + frag : '');
}

const docName = f => f.name.replace(/\.md$/, '');
function linkFor(full){
  const [p, frag] = full.split('#'); const a = frag ? '/' + encodeURIComponent(frag) : '';
  let m;
  if ((m = p.match(/^doc\/(?:produit\/)?(.+)\.md$/))) return '#/doc/' + encodeURIComponent(m[1]) + a;
  if ((m = p.match(/^technique\/(.+)\.md$/))) return '#/tech/' + encodeURIComponent(m[1]) + a;
  if (p === 'glossaire.md') return '#/glossaire' + a;
  if (/^etonnements\//.test(p)) return '#/etonnements';
  if ((m = p.match(/^backlog\/(.+)\.md$/))){ const b = D.backlog.find(x => x.path === p); const id = b ? blId(b) : (m[1].match(/^\d+\.\d+-\d+/) || [m[1]])[0]; return '#/backlog/' + encodeURIComponent(id); }
  if ((m = p.match(/^versions\/([^/]+)\/(.+?)(\.humain)?\.md$/))){

function withToc(pageEl, contentEl, anchor, target){
  const hs = [...contentEl.querySelectorAll('.md h2, .md h3')].filter(h => h.id && !h.closest('details'));
  if (hs.filter(h => h.tagName === 'H2').length < 3) { if (anchor) jump(contentEl, anchor); return; }
  const col = document.createElement('div'); col.className = 'col';
  const toc = document.createElement('aside'); toc.className = 'toc'; toc.setAttribute('aria-label', 'Sur cette page');
  toc.innerHTML = '<b>Sur cette page</b>' + hs.map(h => '<a href="#" data-to="' + h.id + '" class="' + (h.tagName === 'H3' ? 'sub' : '') + '">' + esc(h.textContent) + '</a>').join('');
  if (target){
    const grid = document.createElement('div'); grid.className = 'toc-grid';
    target.replaceWith(grid); col.appendChild(target); grid.append(col, toc); pageEl.classList.add('wide-toc');
  } else {
    while (pageEl.firstChild) col.appendChild(pageEl.firstChild);
    pageEl.classList.add('with-toc'); pageEl.append(col, toc);
  }
  toc.querySelectorAll('a').forEach(a => a.addEventListener('click', e => { e.preventDefault(); jump(contentEl, a.dataset.to); }));
  const links = [...toc.querySelectorAll('a')];
  const onScroll = () => { let cur = hs[0]; hs.forEach(h => { if (h.getBoundingClientRect().top < 120) cur = h; }); links.forEach(l => l.classList.toggle('on', l.dataset.to === cur.id)); };
  window.removeEventListener('scroll', window.__ljosToc || (() => {})); window.__ljosToc = onScroll;

  if (anchor) jump(contentEl, anchor);
}

  const as = avg(scores), aq = avg(qas);
  h += '<div class="tiles">' +
    tileH('Versions', V.length, '', plural(done, 'terminée'), 'list') +
    tileH('Score moyen des specs', has(as) ? as : '–', has(as) ? '/100' : '', has(as) ? meter(as, solid(sTone(as, PASS, FLOOR))) : 'Aucune spec notée', 'score') +
    tileH('Réussite des tests', has(aq) ? aq : '–', has(aq) ? '%' : '', has(aq) ? meter(aq, solid(sTone(aq, 90, 70))) : 'Aucun test pour l\u2019instant', 'flask') +
    tileH('Règles apprises', rules, '', '<a href="#/etonnements" style="text-decoration:underline;text-underline-offset:3px">Voir les apprentissages</a>', 'bulb') + '</div>';
  const todos = V.filter(x => x.i.statut === 'terminee' && x.i.guide).map(x => ({ ...x, p: guideProgress(x.v.id, x.i.guide) })).filter(x => x.p && x.p.total && x.p.done < x.p.total);
  if (todos.length) h += '<div class="h2">À tester avant de merger</div>' + todos.map(x => '<a class="todo" href="#/v/' + encodeURIComponent(x.v.id) + '/qa">' + icon('flask') + '<div class="grow"><b>' + esc(x.i.num + ' — ' + x.i.titre) + '</b><span>' + x.p.done + ' sur ' + x.p.total + ' vérifications faites</span></div>' + icon('chev') + '</a>').join('');
  const bo = blOpen();
  if (bo.length){ const nh = bo.filter(b => b.meta.priorite === 'haute').length; h += '<div class="h2">Backlog <span>' + bo.length + ' à décider' + (nh ? ', dont ' + nh + ' en priorité haute' : '') + '</span></div><div class="rows bl">' + bo.slice().sort(blSort).slice(0, 3).map(blRow).join('') + '<a href="#/backlog"><span class="n"></span><div class="grow"><b style="color:var(--muted)">Voir tout le backlog</b></div>' + icon('chev') + '</a></div>'; }
  h += '<div class="h2"><a href="#/versions" style="color:inherit">Versions</a> <span>' + (V.length > 5 ? '5 plus récentes sur ' + V.length : V.length) + '</span></div>';
  h += V.length ? versionsTable(V.slice(0, 5)) + (V.length > 5 ? '<div class="rows"><a href="#/versions"><span class="n"></span><div class="grow"><b style="color:var(--muted)">Voir les ' + V.length + ' versions</b></div>' + icon('chev') + '</a></div>' : '') : empty('Aucune version pour l\u2019instant.');
  h += otherBranchesBlock();
  const card = (href, ic, d) => '<a class="gcard" href="' + href + '">' + icon(ic) + '<b>' + esc(d.meta.titre || docName(d)) + '</b><p>' + esc(firstLine((d.human && d.human.body) || d.body)) + '</p><span class="tag">Mise à jour en ' + esc(d.meta.maj || '?') + '</span>' + (d.fresh && d.fresh.stale ? ' <span class="tag yellow">À revérifier</span>' : '') + '</a>';
  h += '<div class="h2">Documentation produit <span>' + D.docs.length + '</span></div>';
  h += D.docs.length ? '<div class="gallery">' + D.docs.map(d => card('#/doc/' + encodeURIComponent(docName(d)), 'doc', d)).join('') + '</div>' : empty('La documentation apparaîtra après la première version.');
  h += '<div class="h2">Référentiel technique <span>' + D.technique.length + '</span></div>';
  h += D.technique.length ? '<div class="gallery">' + D.technique.map(d => card('#/tech/' + encodeURIComponent(docName(d)), TECH_ICON[docName(d).split('-')[0]] || 'code', d)).join('') + '</div>' : empty('Le référentiel technique sera rédigé à la première exécution.');
  page(h, true);
}

function ucfirst(t){ t = String(t).trim(); return t.charAt(0).toLocaleUpperCase('fr') + t.slice(1); }

  let h = '';

/* ---------- Backlog ---------- */
const BL = {
  nature: { bug:['red','Bug','bug'], evolution:['blue','Évolution','spark'], dette:['yellow','Dette','code'] },
  statut: { ouvert:['blue','À décider'], planifie:['purple','Planifiée'], fait:['green','Faite'], refuse:['','Refusée'], voulu:['','Voulu'] },
  priorite: { haute:['red','Priorité haute'], moyenne:['yellow','Priorité moyenne'], basse:['','Priorité basse'] },
  preuve: { reproduite:['green','Reproduite'], constatee:['blue','Constatée'], argumentee:['','Argumentée'] },
};
const ORIG = { arbitre:'Écartée par l’arbitre', 'revue-spec':'Revue de la spec', pilote:'Pilote', 'revue-code':'Revue de code', qa:'Tests', tache:'Réalisation', relecteur:'Relecture de la doc', utilisateur:'Toi' };
const blTag = (k, v) => { if (!v) return ''; const x = BL[k][v]; return '<span class="tag ' + (x ? x[0] : '') + '">' + esc(x ? x[1] : v) + '</span>'; };
const blId = b => String(b.meta.id || b.name.replace(/\.md$/, ''));
const blVersions = b => String(has(b.meta.versions) ? b.meta.versions : blId(b).split('-')[0]).split(',').map(x => x.trim()).filter(Boolean);
const idNums = id => String(id).split(/[.-]/).map(Number);
const cmpId = (a, b) => { const x = idNums(a), y = idNums(b); for (let k = 0; k < Math.max(x.length, y.length); k++){ const d = (x[k] || 0) - (y[k] || 0); if (d) return d; } return 0; };
const RANK = { haute:0, moyenne:1, basse:2 }, PRANK = { reproduite:0, constatee:1, argumentee:2 };
const blSort = (a, b) => (RANK[a.meta.priorite] ?? 3) - (RANK[b.meta.priorite] ?? 3) || (PRANK[a.meta.preuve] ?? 3) - (PRANK[b.meta.preuve] ?? 3) || blVersions(b).length - blVersions(a).length || cmpId(blId(b), blId(a));
const blSection = (b, name) => { const sec = ('\n' + b.body).split(/\n(?=##\s)/).find(x => new RegExp('^##\\s+' + name).test(x.trim())); return sec ? sec.trim().split('\n').slice(1).join(' ').replace(/\s+/g, ' ').trim() : ''; };
const blSummary = b => blSection(b, 'Résumé') || firstLine(b.body);
const blRow = b => '<a href="#/backlog/' + encodeURIComponent(blId(b)) + '"><span class="n">' + esc(blId(b)) + '</span><div class="grow"><b>' + esc(b.meta.titre || blId(b)) + '</b><span>' + esc(blSummary(b).replace(/[*`]/g, '')) + '</span></div>' + blTag('nature', b.meta.nature) + blTag('priorite', b.meta.priorite) + icon('chev') + '</a>';
const blOpen = () => D.backlog.filter(b => b.meta.statut === 'ouvert');

function backlogPage(){
  setCrumbs([['Vue d’ensemble', '#/'], ['Backlog']]);
  const B = D.backlog;
  let h = '<div class="p-icon" style="background:var(--red-tag);color:var(--red-ink)">' + icon('inbox') + '</div><h1 class="p-title">Backlog</h1><p class="lede">Ce que les versions ont repéré sans le traiter : bugs, évolutions, dette. À toi de décider : lancer une version qui s’en occupe, refuser, ou dire qu’un comportement est voulu.</p>';
  if (!B.length) return page(h + empty('Le backlog se remplit à la fin de chaque version, avec ce qui a été repéré hors du périmètre.'));
  const open = blOpen(), hi = open.filter(b => b.meta.priorite === 'haute');
  const cnt = n => open.filter(b => b.meta.nature === n).length;
  const repro = open.filter(b => b.meta.nature === 'bug' && b.meta.preuve === 'reproduite').length;
  h += '<div class="tiles">' +
    tileH('À décider', open.length, '', plural(B.length, 'entrée') + ' au total', 'inbox') +
    tileH('Priorité haute', '<span style="color:' + (hi.length ? 'var(--red)' : 'inherit') + '">' + hi.length + '</span>', '', 'parmi celles à décider', 'score') +
    tileH('Bugs à décider', cnt('bug'), '', cnt('bug') ? (repro ? 'dont ' + repro + ' reproduit' + (repro > 1 ? 's' : '') : 'aucun reproduit') : 'aucun', 'bug') +
    tileH('Évolutions et dette', cnt('evolution') + cnt('dette'), '', plural(cnt('evolution'), 'évolution') + ', ' + plural(cnt('dette'), 'dette'), 'spark') + '</div>';
  if (hi.length) h += '<div class="h2">À décider en premier <span>' + hi.length + '</span></div><div class="rows bl">' + hi.slice().sort(blSort).map(blRow).join('') + '</div>';
  h += '<div class="h2">Toutes les entrées</div><div class="filters" id="blf"></div><div id="blt"></div>';
  const p = page(h, true);
  const s0 = store.get('ljos:bl:s');
  let fN = store.get('ljos:bl:n') || '', fS = s0 === null ? 'ouvert' : s0;
  const seg = (k, cur, opts, count) => '<div class="seg" role="group" data-k="' + k + '">' + opts.map(([v, l]) => '<button data-v="' + v + '" class="' + (cur === v ? 'on' : '') + '">' + l + '<small>' + count(v) + '</small></button>').join('') + '</div>';
  const draw = () => {
    p.querySelector('#blf').innerHTML =
      seg('n', fN, [['', 'Tout'], ['bug', 'Bugs'], ['evolution', 'Évolutions'], ['dette', 'Dette']], v => B.filter(b => (!v || b.meta.nature === v) && (!fS || b.meta.statut === fS)).length) +
      seg('s', fS, [['ouvert', 'À décider'], ['planifie', 'Planifiées'], ['fait', 'Faites'], ['refuse', 'Refusées'], ['voulu', 'Voulus'], ['', 'Tous statuts']], v => B.filter(b => (!fN || b.meta.nature === fN) && (!v || b.meta.statut === v)).length);
    const L = B.filter(b => (!fN || b.meta.nature === fN) && (!fS || b.meta.statut === fS)).sort(blSort);
    p.querySelector('#blt').innerHTML = L.length ? '<div class="db-wrap"><table class="db"><thead><tr><th>ID</th><th>Entrée</th><th>Nature</th><th>Priorité</th><th>Preuve</th><th>Vue en</th><th>Statut</th></tr></thead><tbody>' +
      L.map(b => '<tr data-href="#/backlog/' + encodeURIComponent(blId(b)) + '"><td class="id">' + esc(blId(b)) + '</td><td class="ttl">' + esc(b.meta.titre || blId(b)) + '<span class="sum">' + esc(blSummary(b).replace(/[*`]/g, '')) + '</span></td><td>' + blTag('nature', b.meta.nature) + '</td><td>' + (blTag('priorite', b.meta.priorite).replace('Priorité ', '').replace(/>(\w)/, (x, c) => '>' + c.toUpperCase())) + '</td><td>' + blTag('preuve', b.meta.preuve) + '</td><td style="white-space:nowrap">' + blVersions(b).map(vlink).join(' ') + '</td><td>' + blTag('statut', b.meta.statut) + '</td></tr>').join('') + '</tbody></table></div>' : empty('Aucune entrée pour ce filtre.');
    p.querySelectorAll('#blf .seg button').forEach(bt => bt.addEventListener('click', () => {
      if (bt.parentNode.dataset.k === 'n'){ fN = bt.dataset.v; store.set('ljos:bl:n', fN); } else { fS = bt.dataset.v; store.set('ljos:bl:s', fS); }
      draw();
    }));
  };
  draw();
}

  const p = page(h);
  const shown = Object.assign({}, b, { body: ('\n' + b.body).split(/\n(?=##\s)/).filter(x => !/^##\s/.test(x) || x.trim().split('\n').slice(1).join('').trim()).join('\n').replace(/^\n/, '') });

    }));
  };
  draw();
}

/* ---------- Routeur ---------- */
function closeSide(){ $('#side').classList.remove('open'); $('#scrim').classList.remove('open'); }
function route(){
  const hash = location.hash || '#/';
  const parts = hash.replace(/^#\/?/, '').split('/').map(decodeURIComponent);
  closeSide();
  if (parts[0] === 'doc' || parts[0] === 'tech') { renderSide('#/' + parts[0] + '/' + encodeURIComponent(parts[1])); return docPage(parts[0], parts[1], parts[2]); }
  if (parts[0] === 'glossaire') { renderSide('#/glossaire'); return glossairePage(parts[1]); }
  if (parts[0] === 'changelog') { renderSide('#/changelog'); return changelogPage(); }
  if (parts[0] === 'etonnements') { renderSide('#/etonnements'); return etonnementsPage(); }
  if (parts[0] === 'versions') { renderSide('#/versions'); return versionsPage(); }
  if (parts[0] === 'backlog') { renderSide('#/backlog'); return parts[1] ? backlogItem(parts[1]) : backlogPage(); }
  if (parts[0] === 'v') {
    renderSide('#/versions');
    if (parts[2] === 'f') return versionPage(parts[1], null, parts.slice(3).join('/'));
    return versionPage(parts[1], parts[2] || '');
  }
  renderSide('#/'); home();
}
document.addEventListener('click', e => {

  const b = e.target.closest('[data-copy]'); if (!b) return;
  const txt = b.getAttribute('data-copy'), span = b.querySelector('span');
  (navigator.clipboard ? navigator.clipboard.writeText(txt) : Promise.reject()).then(() => { const o = span.textContent; span.textContent = 'Commande copiée'; setTimeout(() => span.textContent = o, 1400); }).catch(() => prompt('Commande :', txt));
});

  };
  if (location.protocol === 'file:') return startScreen('Cette page a été ouverte directement depuis le disque : elle ne peut pas lire les fichiers de la documentation.');
  const keepScroll = () => { try { sessionStorage.setItem('ljos:scroll', location.hash + '|' + window.scrollY); } catch(e){} };
  const restoreScroll = () => { try { const v = sessionStorage.getItem('ljos:scroll'); sessionStorage.removeItem('ljos:scroll'); if (!v) return; const [h, y] = v.split('|'); if (h === location.hash) setTimeout(() => window.scrollTo(0, +y), 60); } catch(e){} };
  fetch('data.json', { cache: 'no-store' }).then(r => { if (!r.ok) throw new Error(r.status); return r.json(); }).then(data => {
    app(data); restoreScroll();
    document.getElementById('refreshBtn').addEventListener('click', () => { keepScroll(); location.reload(); });
    if (window.EventSource){
      const es = new EventSource('events');
      es.onopen = () => setLive('on', 'En direct');
      es.addEventListener('change', () => { keepScroll(); location.reload(); });
      es.onerror = () => setLive('off', 'Serveur arrêté');
    }
  }).catch(() => startScreen('Le serveur de documentation ne répond pas.'));
})();
</script>
</body>
</html>
